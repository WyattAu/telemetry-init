[package]
name = "telemetry-kit"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "One-call observability bootstrap for Rust services — tracing + metrics + OTLP wired with estate defaults"
license = "MIT OR Apache-2.0"
repository = "https://github.com/WyattAu/telemetry-kit"
keywords = ["telemetry", "tracing", "observability", "opentelemetry", "metrics"]
categories = ["development-tools::profiling"]
exclude = [".github/", "benches/"]

[features]
default = ["metrics", "json"]
# metrics-kit registry, handed to the caller as an Arc for hot-path handles.
metrics = ["dep:metrics-kit"]
# JSON log formatting (tracing-subscriber's json feature). Without it,
# requesting LogFormat::Json is a configuration error, not a silent fallback.
json = ["tracing-subscriber/json"]
# OTLP trace export via opentelemetry-otlp, wired as a tracing layer.
otlp = [
  "dep:opentelemetry",
  "dep:opentelemetry-otlp",
  "dep:opentelemetry_sdk",
  "dep:tracing-opentelemetry",
]

[dependencies]
metrics-kit = { version = "0.1", optional = true }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = [
  "fmt",
  "registry",
  "env-filter",
  "ansi",
] }
opentelemetry = { version = "0.32", default-features = false, features = [
  "trace",
], optional = true }
opentelemetry-otlp = { version = "0.32", default-features = false, features = [
  "http-proto",
  "reqwest-blocking-client",
  "trace",
  "internal-logs",
], optional = true }
opentelemetry_sdk = { version = "0.32", default-features = false, features = [
  "trace",
], optional = true }
tracing-opentelemetry = { version = "0.33", default-features = false, optional = true }

[dev-dependencies]
criterion = "0.7"

[[bench]]
name = "init_bench"
harness = false

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
undocumented_unsafe_blocks = "deny"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
