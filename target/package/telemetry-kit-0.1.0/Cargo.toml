[package]
edition = "2021"
rust-version = "1.85"
name = "telemetry-kit"
version = "0.1.0"
build = false
exclude = [
    ".github/",
    "benches/",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "One-call observability bootstrap for Rust services — tracing + metrics + OTLP wired with estate defaults"
readme = "README.md"
keywords = [
    "telemetry",
    "tracing",
    "observability",
    "opentelemetry",
    "metrics",
]
categories = ["development-tools::profiling"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/WyattAu/telemetry-kit"

[features]
default = [
    "metrics",
    "json",
]
json = ["tracing-subscriber/json"]
metrics = ["dep:metrics-kit"]
otlp = [
    "dep:opentelemetry",
    "dep:opentelemetry-otlp",
    "dep:opentelemetry_sdk",
    "dep:tracing-opentelemetry",
]

[lib]
name = "telemetry_kit"
path = "src/lib.rs"

[[test]]
name = "error_contract"
path = "tests/error_contract.rs"

[[test]]
name = "global_init"
path = "tests/global_init.rs"

[dependencies.metrics-kit]
version = "0.1"
optional = true

[dependencies.opentelemetry]
version = "0.32"
features = ["trace"]
optional = true
default-features = false

[dependencies.opentelemetry-otlp]
version = "0.32"
features = [
    "http-proto",
    "reqwest-blocking-client",
    "trace",
    "internal-logs",
]
optional = true
default-features = false

[dependencies.opentelemetry_sdk]
version = "0.32"
features = ["trace"]
optional = true
default-features = false

[dependencies.thiserror]
version = "2"

[dependencies.tracing]
version = "0.1"

[dependencies.tracing-opentelemetry]
version = "0.33"
optional = true
default-features = false

[dependencies.tracing-subscriber]
version = "0.3"
features = [
    "fmt",
    "registry",
    "env-filter",
    "ansi",
]
default-features = false

[dev-dependencies.criterion]
version = "0.7"

[lints.clippy]
